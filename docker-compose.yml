name: redpanda-trading-mock

x-app: &app
  build: .
  environment:
    REDPANDA_BROKERS: redpanda:9092
  depends_on:
    redpanda:
      condition: service_healthy
  restart: unless-stopped

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081

  api:
    <<: *app
    container_name: trading-api
    command: python -m uvicorn trading.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  ledger-worker:
    <<: *app
    container_name: ledger-worker
    command: python -m trading.workers ledger

  risk-worker:
    <<: *app
    container_name: risk-worker
    command: python -m trading.workers risk

  matching-worker:
    <<: *app
    container_name: matching-worker
    command: python -m trading.workers matching
